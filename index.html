<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'enquête de l'Avent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="De Nazareth à la crèche : 14 témoins, 14 énigmes, une lettre par jour.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Storybook journey: one illustrated vertical road from Nazareth (top, night) to the crèche (bottom, night),
   crossing a day of desert. Each day opens as an animated book page over the map. Single deliberate look. */
:root{
  --night:#1b1840; --night2:#2e2a6b; --dusk:#8a4f7d; --rose:#d9837d; --sand:#f1d9ae; --sand2:#e6c28c; --dune:#d8a86f;
  --paper:#fff8ea; --paper2:#f7ead0; --ink:#2b2238; --muted:#7b6a5d; --red:#b5413a; --gold:#e6a92e; --gold2:#ffd27a;
  --river:#6fa8d4; --green:#7d8f4e; --c1:#2f8a8a; --c2:#3e6fa3; --c3:#7a4f9a;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}

/* ===== MAP ===== */
#world{position:relative;width:100%;overflow:hidden}
#world::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(1200px 800px at 50% 0%,#2e2a6b,transparent),linear-gradient(180deg,#1b1840,#3a2f63 40%,#1b1840)}
#map{display:block;width:100%;height:auto}
.title{position:absolute;top:calc(28px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;padding:0 16px;pointer-events:none}
.title .eb{display:inline-block;pointer-events:auto;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);user-select:none;padding:4px 8px}
.title h1{font-size:clamp(34px,8vw,64px);text-shadow:0 4px 0 rgba(0,0,0,.25)}
.title p{margin:8px auto 0;max-width:34ch;color:#e9dff5;font-size:clamp(14px,2.6vw,17px)}
.st{cursor:pointer;outline:none}
.st .med{transition:transform .25s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:center}
.st:hover .med,.st:focus-visible .med{transform:scale(1.12)}
.st:focus-visible .ring{stroke:var(--gold2);stroke-width:6}
.st.locked{cursor:pointer}
.st.shake .med{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px) rotate(-6deg)}40%{transform:translateX(7px) rotate(6deg)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.today .halo{animation:halo 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes halo{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.today .med{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.cloud{animation:drift 90s linear infinite}
@keyframes drift{from{transform:translateX(-1300px)}to{transform:translateX(2100px)}}
.flow{animation:flow 2.5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-60}}
.sway{animation:sway 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
@keyframes sway{50%{transform:rotate(3deg)}}
.hop{animation:hop 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-8px)}}
.glow{animation:glow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glow{50%{transform:scale(1.15);opacity:.65}}
#pion{transition:none}
.walk{animation:walk .35s ease-in-out infinite}
@keyframes walk{50%{transform:translateY(-4px)}}

.tip{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--paper);color:var(--ink);
  padding:12px 18px;border-radius:16px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:.3s;pointer-events:none;z-index:40;max-width:calc(100% - 32px);text-align:center}
.tip.on{opacity:1;transform:translate(-50%,0)}

/* floating carnet button */
.carnetbtn{position:fixed;z-index:30;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;background:var(--paper);border:0;border-radius:999px;padding:10px 18px 10px 10px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-weight:600}
.carnetbtn .ic{width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:20px}
.carnetbtn small{display:block;font-weight:500;color:var(--muted);font-size:12px;line-height:1.1}
.todaybtn{position:fixed;z-index:30;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:var(--gold);border:0;border-radius:999px;padding:14px 20px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35);color:var(--ink)}
.previewbtn{position:fixed;z-index:31;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}

/* ===== OVERLAYS ===== */
.ov{position:fixed;inset:0;z-index:50;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .35s}
.ov.on{opacity:1;pointer-events:auto}
.book{position:absolute;inset:0;overflow:auto;background:var(--paper);transform:scale(.96);transition:transform .5s cubic-bezier(.2,1.1,.3,1);overscroll-behavior:contain}
.ov.on .book{transform:none}

.close{position:sticky;top:0;z-index:6;height:0}
.close>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.close .pill{box-shadow:0 4px 14px rgba(0,0,0,.25)}
.dhero{position:relative;overflow:hidden;color:#fff;padding:calc(84px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 90px max(18px,env(safe-area-inset-left,0px))}
.dhero .deco{position:absolute;inset:0;width:100%;height:100%}
.dhero .head{position:relative;max-width:920px;margin:0 auto;padding:0}
.dhero .head .k{color:var(--gold2)}
.dhero.day{color:var(--ink)}
.dhero.day .head .k{color:var(--red)}
.dhero.day .head h2{text-shadow:none}
.frame div.novid{display:grid;background:linear-gradient(180deg,var(--night2),var(--dusk) 70%,var(--rose))}
.dhero .head h2{text-shadow:0 3px 0 rgba(0,0,0,.2);font-size:clamp(32px,6.5vw,60px)}
.dhero .head svg{width:clamp(96px,16vw,150px);height:auto}
.pg{max-width:920px;margin:-56px auto 0;position:relative;padding:0 max(18px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.pill{border:0;background:var(--paper2);border-radius:999px;padding:9px 16px;font-weight:600}
.pill[disabled]{opacity:.35;cursor:default}
.navs{display:flex;gap:8px}

.head{display:flex;gap:18px;align-items:center;padding:4px 0 18px}
.head svg{flex:none;width:96px;height:96px}
.head{position:relative}
.head .k{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.head h2{font-size:clamp(28px,5.5vw,44px)}
.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}}
.rise{animation:rise .6s ease both}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.frame{background:#6b4a32;padding:10px;border-radius:20px;box-shadow:inset 0 0 0 4px #8a6142,0 10px 0 #4a3222}
.frame video,.frame .novid{display:block;width:100%;aspect-ratio:16/9;border-radius:12px;background:#000}
.novid{background:linear-gradient(180deg,var(--night2),var(--dusk) 70%,var(--rose));color:#fff;display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:clamp(18px,3.4vw,26px);padding:16px}
.sec{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.sec>h3{font-size:24px}
.sec>p.hint,.hint{color:var(--muted);font-size:14px;margin:0}

/* scroll (témoignage) */
.scroll{border:0;background:none;padding:0;text-align:left;width:100%}
.scroll .bar{width:100%;display:flex;align-items:center;gap:10px;background:var(--paper2);border-radius:14px;padding:12px 16px;font-weight:600}
.scroll .bar::after{content:"+";margin-left:auto;font-size:22px;line-height:1;transition:transform .3s}
.scroll[aria-expanded="true"] .bar::after{transform:rotate(45deg)}
.scrolltext{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease}
.scrolltext>div{overflow:hidden}
.scrolltext.on{grid-template-rows:1fr}
.scrolltext p{margin:10px 0 0;padding:16px 18px;background:repeating-linear-gradient(0deg,#fbf1dc 0 30px,#f6e7c8 30px 31px);border-radius:12px;font-style:italic;font-size:17px}

/* flip cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.flip{border:0;background:none;padding:0;perspective:900px;min-height:210px;text-align:left}
.flip .in{display:block;position:relative;width:100%;height:100%;min-height:210px;transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:16px;display:flex;flex-direction:column;gap:6px}
.front{background:var(--k);color:#fff;justify-content:center;align-items:center;text-align:center;
  background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.18) 0 18%,transparent 19%),radial-gradient(circle at 85% 80%,rgba(255,255,255,.12) 0 22%,transparent 23%)}
.front b{font-family:var(--display);font-size:30px}
.front small{opacity:.9}
.front .tap{margin-top:8px;font-size:13px;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px}
.back{background:#fff;border:3px solid var(--k);transform:rotateY(180deg)}
.back b{font-family:var(--display);color:var(--k);font-size:18px}
.back p{margin:0;font-size:15.5px}

/* envelope défi */
.env{border:0;background:none;padding:0;width:100%;text-align:left}
.envbox{position:relative;background:#e9c98f;border-radius:16px;padding:22px;min-height:150px;overflow:hidden;box-shadow:0 8px 0 #c9a46a}
.envbox::before{content:"";position:absolute;inset:0 0 auto;height:90px;background:linear-gradient(160deg,#dcb877 50%,transparent 50.5%),linear-gradient(200deg,#dcb877 50%,transparent 50.5%);
  background-size:50% 100%;background-repeat:no-repeat;background-position:left,right;transform-origin:top;transition:transform .6s}
.seal{position:absolute;left:50%;top:62px;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;
  font-family:var(--display);font-weight:700;font-size:15px;box-shadow:0 0 0 5px #9c3a33;transition:.4s;z-index:2}
.envlabel{position:relative;z-index:1;margin-top:96px;text-align:center;font-weight:600;color:#6b4a32}
.letter{position:relative;z-index:2;background:var(--paper);border-radius:12px;padding:18px;margin-top:0;display:none;flex-direction:column;gap:6px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.letter h3{font-size:24px;color:var(--red)}
.letter p{margin:0}
.env.on .envbox::before{transform:scaleY(-1)}
.env.on .seal{transform:translate(-50%,-50%) scale(0) rotate(90deg)}
.env.on .envlabel{display:none}
.env.on .letter{display:flex;animation:rise .6s ease both}

/* lettre tile */
.tilewrap{display:flex;gap:18px;align-items:center;background:var(--paper2);border-radius:18px;padding:16px}
.tile{flex:none;border:0;padding:0;background:none;width:96px;height:116px;perspective:600px;position:relative}
.tile .in{display:block;position:absolute;inset:0;transition:transform .8s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.tile.on .in{transform:rotateY(180deg)}
.tile .f,.tile .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;font-family:var(--display);font-weight:700}
.tile .f{background:var(--red);color:#fff;font-size:48px;box-shadow:0 6px 0 #8c3029}
.tile .b{background:#fff;border:4px solid var(--gold);color:var(--red);font-size:64px;transform:rotateY(180deg);box-shadow:0 6px 0 #c48d1f}
.tile.nope .f{background:#cfc2ad;box-shadow:0 6px 0 #b0a28b}
.spark{position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:80;animation:spark .9s ease-out forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}

/* carnet */
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:6px}
.cell{aspect-ratio:3/4;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:clamp(20px,5vw,36px);
  border:3px dashed #d9c7a8;color:var(--red);background:#fff}
.cell.got{border:3px solid var(--gold);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.cell small{display:block;font-size:11px;color:var(--muted);font-family:var(--body);font-weight:500;line-height:1}
.words{display:flex;flex-direction:column;gap:14px}

/* final crèche */
.creche{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,var(--night),var(--night2) 60%,var(--dusk))}
.creche svg{display:block;width:100%;height:auto}
.curtain{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#8c2f2a 0 26px,#a7382f 26px 52px);transform-origin:top;transition:transform 1.4s cubic-bezier(.6,0,.3,1);
  display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:clamp(20px,4vw,30px);text-align:center;padding:16px}
.creche.open .curtain{transform:scaleY(0)}
.phrase{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;padding:18px 8px 6px}
.phrase .w{display:flex;gap:4px}
.phrase .w span{flex:none;display:grid;place-items:center;width:clamp(28px,6vw,46px);height:clamp(38px,8vw,60px);border-radius:10px;background:#fff;border:3px solid var(--gold);color:var(--red);
  font-family:var(--display);font-weight:700;font-size:clamp(20px,4.5vw,34px);opacity:0;transform:translateY(-60px) rotate(-20deg)}
.creche.open ~ .phrase .w span{animation:drop .6s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes drop{to{opacity:1;transform:none}}
.finaltext{margin:10px 0 0;font-size:17px}

@media (max-width:680px){
  .cards{grid-template-columns:1fr}
  .flip,.flip .in{min-height:160px}
  .dhero .head{flex-direction:column;align-items:flex-start;gap:10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="world">
  <svg id="map" viewBox="0 0 800 2700" role="img" aria-label="Carte du voyage de Nazareth à la crèche"></svg>
  <div class="title">
    <span class="eb" id="eb">Enquête de l'Avent 2026</span>
    <h1>De Nazareth<br>à la crèche</h1>
    <p id="intro"></p>
  </div>
</div>
<button class="todaybtn" id="todaybtn" hidden>Le témoin du jour</button>
<button class="carnetbtn" id="carnetbtn"><span class="ic" id="cnt">0</span><span>Mon carnet<small>le message mystère</small></span></button>
<div class="tip" id="tip" role="status"></div>
<div class="ov" id="ov" aria-hidden="true"><div class="book" id="book" role="dialog" aria-modal="true" aria-label="Témoin"></div></div>

<script>
/* ===================== DONNÉES ===================== */
const PHRASE="IL EST PARMI NOUS";
const REVEAL_FINAL="2026-12-17T11:00:00";   // heure de la découverte de la crèche
const LETTER_HOUR="T16:30:00";              // la lettre du jour s'affiche après la classe
const DAYS=[
 {n:1,date:"2026-11-30",jour:"lundi 30 novembre",nom:"Rachel",titre:"Rachel, la voisine",lieu:"Nazareth",ic:"rachel",video:"videos/temoin-01.mp4",lettre:"I",
  texte:"Vous cherchez Marie et Joseph ? Ils sont partis ce matin, très tôt ! Marie avait un gros ventre tout rond, et ils avaient un baluchon énorme. J'ai jeté un œil dedans… il y avait des choses bizarres.",
  c:["Dans le baluchon : une gourde, du pain, une couverture, une tablette. Qu'est-ce qui n'existait pas à l'époque ?","Devinette : « Je suis pleine d'eau et je pends à l'épaule du voyageur. Qui suis-je ? »","Ils doivent faire 150 km à pied, à environ 25 km par jour. Combien de jours de voyage ?"],
  defi:"Les mots doux du baluchon",defit:"Chaque élève écrit ou dessine un souhait de bon voyage et le glisse dans le baluchon de l'école. On l'ouvrira le 17 décembre."},
 {n:2,date:"2026-12-01",jour:"mardi 1er décembre",nom:"Père Claude",titre:"Père Claude, le gardien des vieilles histoires",lieu:"Nazareth",ic:"book",video:"",lettre:"L",
  texte:"Leur histoire, je la connais : elle est racontée dans un très vieux livre, que je lis souvent. Je ne vais pas tout vous dévoiler, sinon ce ne serait plus une enquête ! Mais je vous confie ceci : la carte de leur voyage.",
  c:["Sur la carte, montre la maison d'où ils partent, puis l'étoile où ils arrivent.","Compte les étapes sur la carte : combien de témoins allez-vous rencontrer ?","Ce très vieux livre rassemble en fait beaucoup de livres. Comment s'appelle-t-il ? (5 lettres, commence par B)"],
  defi:"Rencontre avec Père Claude",defit:"Pas de défi aujourd'hui : on écoute Père Claude et on découvre la carte du voyage."},
 {n:3,date:"2026-12-02",jour:"mercredi 2 décembre",nom:"Le crieur",titre:"Le crieur de l'empereur",lieu:"Nazareth",ic:"horn",video:"videos/temoin-03.mp4",lettre:"E",
  texte:"Oyez, oyez ! Par ordre de l'empereur, tout le monde doit être compté, et chacun doit aller s'inscrire dans la ville de sa famille. Et ce n'est pas tout : toutes les classes doivent se faire belles pour accueillir les voyageurs !",
  c:["Comptons ensemble les enfants de la classe, comme l'empereur !","Complète le nom de la ville de Joseph : B E T H L _ _ M.","Remets les lettres dans l'ordre : M – É – L – T – B – H – E – H."],
  defi:"La grande décoration",defit:"Ce matin, chaque classe décore sa classe et son couloir pour accueillir les voyageurs."},
 {n:4,date:"2026-12-03",jour:"jeudi 3 décembre",nom:"Le pêcheur",titre:"Le pêcheur",lieu:"Vallée du Jourdain",ic:"fish",video:"videos/temoin-04.mp4",lettre:"S",
  texte:"Oui, je les ai vus passer ! Ils suivent mon fleuve, le Jourdain, pour éviter les montagnes. La jeune femme avait l'air fatiguée. Mais regardez mes berges : il y traîne plein de déchets…",
  c:["Compte les poissons dans le filet (dessin distribué en classe).","Avec quoi j'attrape les poissons : un filet, un panier ou un parapluie ?","« Je coule sans jamais m'arrêter, j'ai un lit mais je ne dors jamais. Qui suis-je ? »"],
  defi:"Cour propre",defit:"Chaque classe ramasse les déchets sur sa partie de la cour."},
 {n:5,date:"2026-12-04",jour:"vendredi 4 décembre",nom:"Bourricot",titre:"Bourricot, l'âne",lieu:"Au bord du fleuve",ic:"donkey",video:"videos/temoin-05.mp4",lettre:"T",
  texte:"Hi-han ! C'est moi qui porte Marie et les bagages. Joseph me répète tout le temps : « Doucement, Bourricot, doucement ! » Je me demande bien pourquoi…",
  c:["Imite le cri de Bourricot !","Trouve l'intrus : l'âne, le cheval, la poule, le chameau. Lequel ne peut pas porter Marie ?","Enquête : pourquoi Joseph dit-il « doucement » ? Note ton hypothèse et l'indice qui la soutient."],
  defi:"Un coup de main",defit:"Chaque classe choisit un service à rendre à l'école aujourd'hui."},
 {n:6,date:"2026-12-07",jour:"lundi 7 décembre",nom:"Tobie",titre:"Tobie, l'apprenti de Joseph",lieu:"Le campement",ic:"cradle",video:"videos/temoin-06.mp4",lettre:"P",
  texte:"Ouf, je les ai rattrapés ! Juste avant de partir, Joseph avait fabriqué un objet en bois tout petit, avec beaucoup de soin… et il l'a oublié à l'atelier ! J'ai couru pendant des jours pour le lui rapporter.",

  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];

  <!-- étable -->

    <g transform="translate(16 2)"><path d="M-12 36 Q-18 0 -8 -14 Q0 -22 10 -14 Q16 4 22 14 Q18 30 12 36Z" fill="#3e6fa3"/><ellipse cx="12" cy="12" rx="12" ry="14" fill="#3e6fa3"/><circle cy="-26" r="11" fill="#3e6fa3"/></g>
  </g></g>`;
  $("map").innerHTML=svg;fitMap();
  placePion(cur);
  $("map").querySelectorAll(".st").forEach(g=>{
    const go=()=>{const d=DAYS[g.dataset.n-1];if(isOpen(d)){location.hash="jour-"+d.n}else{g.classList.remove("shake");void g.getBBox();g.classList.add("shake");tip(`Patience ! ${d.n===14?"Le dernier témoin":"Ce témoin"} arrive le ${d.jour}.`)}};
    g.addEventListener("click",go);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}})});

function fitMap(){const W=document.documentElement.clientWidth||innerWidth;const s=W<=800?W/800:Math.min(1.12,Math.max(1,W/1500));
  const vbw=Math.min(3200,W/s);$("map").setAttribute("viewBox",`${(-(vbw-800)/2).toFixed(1)} 0 ${vbw.toFixed(1)} 2700`)}
addEventListener("resize",fitMap);
function stationLen(n){const road=$("road");const L=road.getTotalLength();if(n<=0)return 0;
  // find length nearest to station n
  const [tx,ty]=P[n-1];let best=0,bd=1e9;for(let l=0;l<=L;l+=6){const p=road.getPointAtLength(l);const dd=(p.x-tx)**2+(p.y-ty)**2;if(dd<bd){bd=dd;best=l}}return best}
function placePion(cur){
  const road=$("road"),pion=$("pion");
  if(cur===0){pion.setAttribute("transform","translate(110 430) scale(.9)");return}
  const end=stationLen(cur),start=cur>1?stationLen(cur-1):0;
  const at=l=>{const p=road.getPointAtLength(l);pion.setAttribute("transform",`translate(${p.x+62} ${p.y-30}) scale(.9)`)};
  if(reduce||preview){at(end);return}
  at(start);const t0=performance.now(),D=2200;
  requestAnimationFrame(function f(t){const k=Math.min(1,(t-t0)/D),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;at(start+(end-start)*e);if(k<1)requestAnimationFrame(f)});
}
let lastDay=0;
function scrollToToday(smooth,n){const cur=n||todayN();if(!cur)return;const st=$("map").querySelector(`.st[data-n="${cur}"]`);if(!st)return;
  const r=st.getBoundingClientRect();window.scrollTo({top:window.scrollY+r.top-innerHeight/2+r.height/2,behavior:smooth&&!reduce?"smooth":"auto"})}

/* ===================== PETITS EFFETS ===================== */
let tipT;function tip(t){const e=$("tip");e.textContent=t;e.classList.add("on");clearTimeout(tipT);tipT=setTimeout(()=>e.classList.remove("on"),2600)}
function sparkle(el){if(reduce)return;const r=el.getBoundingClientRect();const cols=["#ffd27a","#e6a92e","#b5413a","#6fa8d4","#fff"];
  for(let i=0;i<26;i++){const s=document.createElement("span");s.className="spark";const a=Math.random()*Math.PI*2,d=60+Math.random()*90;
    s.style.left=(r.left+r.width/2)+"px";s.style.top=(r.top+r.height/2)+"px";s.style.background=cols[i%cols.length];
    s.style.setProperty("--x",Math.cos(a)*d+"px");s.style.setProperty("--y",Math.sin(a)*d+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),950)}}

/* ===================== PAGE DU JOUR ===================== */
function heroHTML(n,inner){
  const sky=n===0?["#1b1840","#2e2a6b","#8a4f7d"]:n<=3?["#2e2a6b","#8a4f7d","#e59a7e"]:n<=11?["#7cb6dd","#bcd9ea","#f6e2b8"]:n<=12?["#8a4f7d","#c46a7a","#f0b088"]:["#1b1840","#2e2a6b","#5a3f7a"];
  const night=n===0||n>=13||n<=1;
  let st="";if(night)for(let i=0;i<40;i++)st+=`<circle class="tw" style="animation-delay:${(Math.random()*2.4).toFixed(2)}s" cx="${(Math.random()*1600).toFixed(0)}" cy="${(Math.random()*260).toFixed(0)}" r="${(1+Math.random()*2).toFixed(1)}" fill="#fff"/>`;
  const ground=n>=4&&n<=11?"#e2b77c":"#b98a6a";
  return `<div class="dhero ${n>=4&&n<=11?"day":""}"><svg class="deco" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs><linearGradient id="hs${n}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset=".6" stop-color="${sky[1]}"/><stop offset="1" stop-color="${sky[2]}"/></linearGradient></defs>
    <rect width="1600" height="500" fill="url(#hs${n})"/>${st}
    ${night?'<circle cx="1360" cy="90" r="36" fill="#fff3c4"/><circle cx="1376" cy="80" r="32" fill="'+sky[0]+'"/>':'<circle cx="1320" cy="120" r="60" fill="#ffd27a" class="glow"/>'}
    <g class="cloud" style="animation-duration:70s"><ellipse cx="200" cy="140" rx="80" ry="22" fill="#fff" opacity=".5"/><ellipse cx="250" cy="128" rx="54" ry="22" fill="#fff" opacity=".5"/></g>
    <path d="M0 400 Q200 330 420 380 T860 360 T1300 380 T1600 360 V500 H0Z" fill="${ground}" opacity=".9"/>
    <path d="M0 450 Q400 410 800 445 T1600 440 V500 H0Z" fill="var(--paper)"/>
  </svg>${inner?`<div class="head">${inner}</div>`:""}</div>`;
}
const CY=[["Cycle 1","PS · MS · GS","var(--c1)"],["Cycle 2","CP · CE1 · CE2","var(--c2)"],["Cycle 3","CM1 · CM2","var(--c3)"]];
function dayHTML(d){
  const n=d.n,got=letterShown(d);
  const prevOk=n>1&&isOpen(DAYS[n-2]),nextOk=n<14&&isOpen(DAYS[n]);
  const vid=d.video?`<video controls preload="metadata" playsinline src="${d.video}"></video>`:`<div class="novid">La vidéo du témoin<br>arrive bientôt…</div>`;
  const cards=d.c.map((q,i)=>`<button class="flip" style="--k:${CY[i][2]}" aria-label="${CY[i][0]} : retourner la carte"><span class="in">
      <span class="face front"><b>${CY[i][0]}</b><small>${CY[i][1]}</small><span class="tap">Touche pour retourner</span></span>
      <span class="face back"><b>${CY[i][0]}</b><p>${esc(q)}</p></span></span></button>`).join("");
  let final="";
  if(n===14){
    const ws=PHRASE.split(" ").map(w=>`<div class="w">${[...w].map(c=>`<span>${c}</span>`).join("")}</div>`).join("");
    final=`<div class="sec"><h3>Le message des 14 témoins</h3>
      <div class="creche" id="creche"><svg viewBox="0 0 800 420" aria-hidden="true">
        ${Array.from({length:30},()=>`<circle class="tw" style="animation-delay:${(Math.random()*2).toFixed(2)}s" cx="${(Math.random()*800).toFixed(0)}" cy="${(Math.random()*180).toFixed(0)}" r="${(1+Math.random()*2).toFixed(1)}" fill="#fff"/>`).join("")}
        <circle cx="400" cy="70" r="70" fill="#fff3c4" opacity=".25" class="glow"/><path d="M400 36 L410 60 L436 62 L416 78 L423 104 L400 90 L377 104 L384 78 L364 62 L390 60Z" fill="#ffd27a"/>
        <path d="M220 420 V230 L400 140 L580 230 V420Z" fill="#6b4a32"/><path d="M250 420 V250 H550 V420Z" fill="#2a1a12"/>
        <g transform="translate(310 360)">${IC.ox}</g><g transform="translate(492 360) scale(-1 1)">${IC.donkey}</g>
        <g transform="translate(345 300)"><path d="M-14 70 Q-18 10 0 0 Q18 10 14 70Z" fill="#5a4636"/><circle cy="-12" r="12" fill="#5a4636"/></g>
        <g transform="translate(455 310)"><path d="M-14 60 Q-18 8 0 0 Q18 8 14 60Z" fill="#3e6fa3"/><circle cy="-12" r="11" fill="#3e6fa3"/></g>
        <path d="M360 410 L370 372 H430 L440 410Z" fill="#c99467"/><path d="M370 374 Q400 362 430 374" stroke="#e6c28c" stroke-width="7"/>
        <circle cx="400" cy="372" r="30" fill="#fff3c4" opacity=".25" class="glow"/>
      </svg>
      <div class="curtain">${got?"Touche le rideau pour découvrir la crèche":"Le rideau se lève tous ensemble, devant la crèche de l'école…"}</div></div>
      <div class="phrase" aria-label="${got?PHRASE:"message caché"}">${got?ws:""}</div>
      ${got?`<p class="finaltext" id="ft" hidden>La mangeoire est vide… et pourtant il est parmi nous : dans tout ce que nous avons donné, fabriqué et partagé pendant ces trois semaines. Ce bébé, c'est Jésus, que l'on attend à Noël. On l'appelle aussi Emmanuel : « Dieu avec nous ».</p>`:""}
    </div>`}
  return `<div class="close"><div><button class="pill" data-act="close">← La carte</button>
      <div class="navs"><button class="pill" data-go="${n-1}" ${prevOk?"":"disabled"} aria-label="Jour précédent">←</button><span class="pill" aria-hidden="true">${n} / 14</span><button class="pill" data-go="${n+1}" ${nextOk?"":"disabled"} aria-label="Jour suivant">→</button></div></div></div>
    ${heroHTML(n,`<span class="pop">${icSVG(d.ic,150)}</span><div class="rise"><div class="k">Jour ${n} · ${esc(d.jour)} · ${esc(d.lieu)}</div><h2>${esc(d.titre)}</h2></div>`)}
    <div class="pg">
    <div class="frame rise" style="animation-delay:.1s">${vid}</div>
    <div class="sec rise" style="animation-delay:.18s"><button class="scroll" aria-expanded="false"><span class="bar">Lire le témoignage</span></button>
      <div class="scrolltext"><div><p>${esc(d.texte)}</p></div></div></div>
    <div class="sec rise" style="animation-delay:.26s"><h3>Les énigmes du jour</h3><p class="hint">Chaque classe retourne la carte de son cycle.</p><div class="cards">${cards}</div></div>
    <div class="sec rise" style="animation-delay:.34s"><h3>Le défi du jour</h3>
      <button class="env" aria-label="Ouvrir l'enveloppe du défi"><div class="envbox"><span class="seal">Défi</span><div class="envlabel">Touche le sceau pour ouvrir</div>
      <div class="letter"><h3>${esc(d.defi)}</h3><p>${esc(d.defit)}</p></div></div></button></div>
    <div class="sec rise" style="animation-delay:.42s"><h3>La lettre du jour</h3>
      <div class="tilewrap"><button class="tile ${got?"":"nope"}" aria-label="${got?"Retourner la lettre":"Lettre pas encore disponible"}"><span class="in"><span class="f">?</span><span class="b">${got?d.lettre:""}</span></span></button>
      <p class="hint" style="font-size:15px">${got?"Touche la tuile pour découvrir la lettre, puis ajoute-la à ton carnet !":n===14?"Elle se révèle tous ensemble, devant la crèche.":"Trouve-la d'abord en classe ! Elle s'affichera ici à 16 h 30."}</p></div></div>
    ${final}</div>`;
}
function carnetHTML(){
  let i=0,cells="";
  const words=PHRASE.split(" ").map(w=>{let row="";for(const ch of w){const d=DAYS[i++];const g=letterShown(d);row+=`<div class="cell ${g?"got":""}" style="animation-delay:${i*0.06}s">${g?ch:`<small>j.${d.n}</small>`}</div>`}return `<div class="grid" style="grid-template-columns:repeat(${Math.max(5,w.length)},minmax(0,56px))">${row}</div>`}).join("");
  const nb=DAYS.filter(letterShown).length;
  return `<div class="close"><div><button class="pill" data-act="close">← La carte</button><span class="pill">${nb} / 14 lettres</span></div></div>
    ${heroHTML(0,`<span class="pop">${icSVG("book",150,"#e6a92e")}</span><div class="rise"><div class="k">Mon carnet d'enquêteur</div><h2>Le message mystère</h2></div>`)}
    <div class="pg"><div style="background:var(--paper);border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.12)">
    <p class="hint rise">Chaque témoin donne une lettre. Mises bout à bout, elles forment un message… mais lequel ?</p>
    <div class="words rise" style="margin-top:16px">${words}</div></div></div>`;
}
function wireBook(){
  const b=$("book");
  b.querySelectorAll("[data-act=close]").forEach(x=>x.onclick=()=>{history.pushState("",document.title,location.pathname+location.search);route()});
  b.querySelectorAll("[data-go]").forEach(x=>x.onclick=()=>{location.hash="jour-"+x.dataset.go});
  b.querySelectorAll(".flip").forEach(x=>x.onclick=()=>x.classList.toggle("on"));
  const sc=b.querySelector(".scroll");if(sc)sc.onclick=()=>{const on=sc.getAttribute("aria-expanded")!=="true";sc.setAttribute("aria-expanded",on);sc.nextElementSibling.classList.toggle("on",on)};
  const env=b.querySelector(".env");if(env)env.onclick=()=>{if(!env.classList.contains("on")){env.classList.add("on");sparkle(env.querySelector(".envbox"))}};
  const tile=b.querySelector(".tile");if(tile)tile.onclick=()=>{if(tile.classList.contains("nope")){tip("Pas encore ! Trouvez d'abord la lettre en classe.");return}
    if(!tile.classList.contains("on")){tile.classList.add("on");setTimeout(()=>sparkle(tile),350);updateCount()}};
  const cr=b.querySelector("#creche");if(cr&&b.querySelector("#ft")!==null){cr.onclick=()=>{if(cr.classList.contains("open"))return;cr.classList.add("open");
    b.querySelectorAll(".phrase .w span").forEach((s,i)=>s.style.animationDelay=(1.2+i*0.12)+"s");const ft=b.querySelector("#ft");setTimeout(()=>{ft.hidden=false;ft.classList.add("rise");sparkle(cr)},1300+PHRASE.length*120)}}
}
function openBook(html,label){const ov=$("ov"),b=$("book");b.innerHTML=html;b.setAttribute("aria-label",label);b.scrollTop=0;wireBook();
  ov.classList.add("on");ov.setAttribute("aria-hidden","false");document.body.style.overflow="hidden"}
function closeBook(){const ov=$("ov");ov.classList.remove("on");ov.setAttribute("aria-hidden","true");document.body.style.overflow="";
  $("book").querySelectorAll("video").forEach(v=>v.pause())}
$("ov").addEventListener("click",e=>{if(e.target.id==="ov"){history.pushState("",document.title,location.pathname+location.search);route()}});
addEventListener("keydown",e=>{if(e.key==="Escape"&&$("ov").classList.contains("on")){history.pushState("",document.title,location.pathname+location.search);route()}});

/* ===================== ROUTAGE ===================== */
function route(){
  const m=location.hash.match(/^#jour-(\d+)$/);
  if(m){const d=DAYS[+m[1]-1];if(d&&isOpen(d)){lastDay=d.n;openBook(dayHTML(d),d.titre);return}
    if(d){tip(`Patience ! Ce témoin arrive le ${d.jour}.`)}history.replaceState("",document.title,location.pathname+location.search)}
  if(location.hash==="#carnet"){openBook(carnetHTML(),"Mon carnet");return}
  const wasOpen=$("ov").classList.contains("on");closeBook();if(wasOpen)scrollToToday(false,lastDay);
}
function updateCount(){$("cnt").textContent=DAYS.filter(letterShown).length}
function init(){
  const cur=todayN();
  $("intro").textContent=cur===0?"Rendez-vous le lundi 30 novembre pour rencontrer le premier témoin !":"Deux voyageurs ont quitté Nazareth avec un gros baluchon. Où vont-ils ? Suivez leur route, un témoin par jour.";
  buildMap();updateCount();
  const tb=$("todaybtn");tb.hidden=cur===0;tb.onclick=()=>{location.hash="jour-"+cur};
  $("carnetbtn").onclick=()=>{location.hash="carnet"};
  document.querySelector(".previewbtn")?.remove();
  if(preview){const b=document.createElement("button");b.className="previewbtn";b.textContent="Mode aperçu · quitter";b.onclick=()=>{try{localStorage.removeItem("avent-apercu")}catch(e){}preview=false;init()};document.body.appendChild(b)}
  route();
}
/* À l'arrivée sur le site : on ouvre directement le témoin du jour */
if(!location.hash&&!preview&&todayN()>0)history.replaceState(null,"","#jour-"+todayN());
let clicks=0,ct;$("eb").addEventListener("click",()=>{clicks++;clearTimeout(ct);ct=setTimeout(()=>clicks=0,900);if(clicks>=3){clicks=0;preview=true;try{localStorage.setItem("avent-apercu","1")}catch(e){}init();tip("Mode aperçu : tous les jours sont ouverts")}});
addEventListener("hashchange",route);
init();
if(!location.hash)setTimeout(()=>scrollToToday(true),600);
</script>
